
modLoader="javafml" #mandatory

loaderVersion="${loader_version_range}" #mandatory

license="${mod_license}"

[[mods]] #mandatory

modId="${mod_id}" #mandatory

version="${mod_version}" #mandatory

displayName="${mod_name}" #mandatory

authors="DoltHHaven"

description='''
    Adds some miscellaneous tweaks to mods
'''

[[mixins]]
    config="${mod_id}.mixins.json"

[[accessTransformers]]
    file="accesstransformer.cfg"

[[dependencies.${mod_id}]] #optional
    modId="neoforge" #mandatory
    type="required" #mandatory
    versionRange="[${neo_version},)" #mandatory
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="blueprint"
    type="required"
    versionRange="[8.1.0,)"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="heart_crystals"
    type="optional"
    ordering="AFTER"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="upgrade_aquatic"
    type="optional"
    ordering="AFTER"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="netherexp"
    type="optional"
    ordering="AFTER"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="environmental"
    type="optional"
    ordering="AFTER"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="atmospheric"
    type="optional"
    versionRange="[7.0.0,)"
    ordering="AFTER"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="mowziesmobs"
    type="optional"
    ordering="AFTER"
    side="BOTH"



